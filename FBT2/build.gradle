buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'   // ← CHANGED from 8.1.0
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0"   // ← CHANGED from 1.9.0
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}